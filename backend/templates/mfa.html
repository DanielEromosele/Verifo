{% extends "base.html" %}
{% block title %}Verify your sign-in — Verifo{% endblock %}
{% block body %}
<main class="auth-main">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark"><span class="material-symbols-outlined">verified</span></span>
      &nbsp;Verifo
    </div>
    <h1 class="auth-title">Two-step check</h1>
    <p class="auth-sub">Enter the 6-digit code from your authenticator app.</p>

    <div id="error-box" class="alert alert-error hidden"></div>

    <form id="mfa-form" novalidate style="margin-top:1.25rem">
      <div style="display:flex;gap:0.5rem;justify-content:center">
        <input class="input otp" id="otp0" inputmode="numeric" maxlength="1" autocomplete="one-time-code" required>
        <input class="input otp" id="otp1" inputmode="numeric" maxlength="1" autocomplete="off" required>
        <input class="input otp" id="otp2" inputmode="numeric" maxlength="1" autocomplete="off" required>
        <input class="input otp" id="otp3" inputmode="numeric" maxlength="1" autocomplete="off" required>
        <input class="input otp" id="otp4" inputmode="numeric" maxlength="1" autocomplete="off" required>
        <input class="input otp" id="otp5" inputmode="numeric" maxlength="1" autocomplete="off" required>
      </div>
      <div class="auth-actions">
        <button type="submit" id="submit-btn" class="btn btn-primary w-full">Verify code</button>
      </div>
    </form>

    <p class="auth-link"><a id="resend" href="#">Resend code</a></p>
    <p class="auth-link"><a href="/signin">Back to sign in</a></p>
  </div>
</main>
<script src="/static/js/common.js"></script>
<script src="/static/js/auth.js"></script>
{% endblock %}
