{% extends "base.html" %}
{% block title %}Sign in — Verifo{% endblock %}
{% block body %}
<main class="auth-main">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark"><span class="material-symbols-outlined">verified</span></span>
      &nbsp;Verifo
    </div>
    <h1 class="auth-title">Sign in</h1>
    <p class="auth-sub">Access your identity verification workspace.</p>

    <div id="error-box" class="alert alert-error hidden"></div>

    <form id="login-form" novalidate>
      <div class="auth-field">
        <label class="label" for="email">Work email</label>
        <input class="input" id="email" name="email" type="email" placeholder="you@organization.com" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="auth-actions">
        <button type="submit" id="submit-btn" class="btn btn-primary w-full">Continue</button>
      </div>
    </form>

    <div class="auth-link"><a href="/reset">Forgot password?</a></div>

    <div class="auth-divider">demo workspace</div>
    <div class="auth-demo">
      <button type="button" class="btn btn-secondary" data-demo-email="admin@demo.edu" data-demo-password="verifo-demo-admin">Admin</button>
      <button type="button" class="btn btn-secondary" data-demo-email="operator@demo.edu" data-demo-password="VerifoDemo123!">Operator</button>
      <button type="button" class="btn btn-secondary" data-demo-email="student@demo.edu" data-demo-password="VerifoDemo123!">Student</button>
    </div>
    <p class="text-sm text-muted" style="text-align:center;margin-top:0.625rem">Click a role to fill its demo credentials.</p>

    <p class="auth-link" style="margin-top:1.25rem">New to Verifo? <a href="/request-access">Request access</a></p>
  </div>
</main>
<script src="/static/js/common.js"></script>
<script src="/static/js/auth.js"></script>
{% endblock %}
